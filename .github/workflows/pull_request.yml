name: CI Build

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      oss_conductor_version:
        description: 'OSS Conductor image tag (falls back to E2E_TEST_OSS_CONDUCTOR_VERSION org var, then to a pinned default on fork PRs)'
        required: false
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Linter
        run: >
          DOCKER_BUILDKIT=1 docker build
          --target=linter
          --progress=plain
          .

  unit_tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run unit tests
        run: >
          dotnet test Tests/conductor-csharp.test.csproj
          -p:DefineConstants=EXCLUDE_EXAMPLE_WORKERS
          --filter "Category!=Integration&Category!=CloudIntegration"
          -l "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory coverage
      - name: Run agent unit tests
        run: |
          for p in Conductor.AI.Tests Conductor.AI.OpenAI.Tests Conductor.AI.GoogleADK.Tests Conductor.AI.SemanticKernel.Tests; do
            dotnet test "$p/$p.csproj" \
              -l "console;verbosity=normal" \
              --collect:"XPlat Code Coverage" \
              --results-directory coverage
          done
      - name: Upload Cobertura artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/**/coverage.cobertura.xml

  build_ai_examples:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build agent examples
        run: dotnet build Conductor.AI.Examples/Conductor.AI.Examples.sln -c Release

  # The release workflow only static-checks the bundle. Compiling it is the check
  # that actually proves it is self-contained, and it needs no published package
  # (--build packs the working tree into a temp feed), so it belongs here — a
  # bundle that cannot build should fail the PR, not ship attached to a release.
  e2e_bundle:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate e2e bundle (static + compile)
        run: ./scripts/test-package-e2e-bundle.sh --build

  integration_tests:
    # Repository secrets are intentionally unavailable to pull requests from forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server-version: [v5, v4]
    name: integration (${{ matrix.server-version }})
    env:
      CONDUCTOR_SERVER_URL: ${{ matrix.server-version == 'v4' && vars.SM_V4_SERVER_URL || secrets.CONDUCTOR_SERVER_URL }}
      CONDUCTOR_AUTH_KEY: ${{ matrix.server-version == 'v4' && vars.SM_V4_AUTH_KEY || secrets.CONDUCTOR_AUTH_KEY }}
      CONDUCTOR_AUTH_SECRET: ${{ matrix.server-version == 'v4' && secrets.SM_V4_AUTH_SECRET || secrets.CONDUCTOR_AUTH_SECRET }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show server endpoint and auth key prefix
        run: |
          echo "CONDUCTOR_SERVER_URL=${CONDUCTOR_SERVER_URL#*://}"
          echo "CONDUCTOR_AUTH_KEY prefix=${CONDUCTOR_AUTH_KEY:0:8}..."
      - name: Run integration tests (${{ matrix.server-version }})
        run: >
          dotnet test Tests/conductor-csharp.test.csproj
          -p:DefineConstants=EXCLUDE_EXAMPLE_WORKERS
          --filter "Category=Integration"
          -l "console;verbosity=normal"

  legacy_integration_tests:
    # Repository secrets are intentionally unavailable to pull requests from forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server-version: v5
            test-filter: "Category=CloudIntegration"
          - server-version: v4
            test-filter: "Category=CloudIntegration&Version!=V5Only"
    name: legacy integration (${{ matrix.server-version }})
    env:
      CONDUCTOR_SERVER_URL: ${{ matrix.server-version == 'v4' && vars.SM_V4_SERVER_URL || secrets.CONDUCTOR_SERVER_URL }}
      CONDUCTOR_AUTH_KEY: ${{ matrix.server-version == 'v4' && vars.SM_V4_AUTH_KEY || secrets.CONDUCTOR_AUTH_KEY }}
      CONDUCTOR_AUTH_SECRET: ${{ matrix.server-version == 'v4' && secrets.SM_V4_AUTH_SECRET || secrets.CONDUCTOR_AUTH_SECRET }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show server endpoint and auth key prefix
        run: |
          echo "CONDUCTOR_SERVER_URL=${CONDUCTOR_SERVER_URL#*://}"
          echo "CONDUCTOR_AUTH_KEY prefix=${CONDUCTOR_AUTH_KEY:0:8}..."
      - name: Run legacy integration tests (${{ matrix.server-version }})
        run: >
          dotnet test Tests/conductor-csharp.test.csproj
          -p:DefineConstants=EXCLUDE_EXAMPLE_WORKERS
          --filter "${{ matrix.test-filter }}"
          -l "console;verbosity=normal"

  integration_tests_oss:
    needs: lint
    runs-on: ubuntu-latest
    env:
      CONDUCTOR_SERVER_URL: http://localhost:8080/api
      # Used only when the org variable is unreachable because the run is a fork
      # PR -- see the resolve step below.
      FORK_PR_FALLBACK_VERSION: '3.32.3'
    steps:
      # OSS_CONDUCTOR_VERSION is resolved here rather than in the job `env` so
      # that the two ways it can come back empty get different treatment:
      #
      #   - Fork PR: GitHub withholds org/repo variables from pull_request runs
      #     on forks exactly as it withholds secrets, so vars.* is always "" for
      #     an outside contributor (observed in csharp-sdk#178). This job needs
      #     no secrets, only a tag, so pin one and keep running.
      #   - Anything else: the org variable is genuinely missing or its
      #     repository access policy no longer covers this repo. Fail loudly
      #     rather than silently drifting onto the pin.
      - name: Resolve OSS Conductor version
        env:
          REQUESTED_VERSION: ${{ inputs.oss_conductor_version || vars.E2E_TEST_OSS_CONDUCTOR_VERSION }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            resolved="$REQUESTED_VERSION"
          elif [ "$IS_FORK_PR" = "true" ]; then
            resolved="$FORK_PR_FALLBACK_VERSION"
            echo "::notice::Fork PR: org variables are withheld, pinning conductoross/conductor:${resolved}"
          else
            echo "::error::No Conductor OSS image tag resolved. Set the E2E_TEST_OSS_CONDUCTOR_VERSION organization variable (and ensure its repository access policy includes this repo), or pass the oss_conductor_version input via workflow_dispatch."
            exit 1
          fi
          echo "OSS_CONDUCTOR_VERSION=${resolved}" >> "$GITHUB_ENV"
          echo "Using conductoross/conductor:${resolved}"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start Conductor OSS stack
        run: docker compose -f scripts/docker-compose-oss.yaml up -d
      - name: Wait for Conductor to be healthy
        run: timeout 120 bash -c 'until curl -sf http://localhost:8080/health; do sleep 5; done'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run integration tests (OSS)
        run: >
          dotnet test Tests/conductor-csharp.test.csproj
          -p:DefineConstants=EXCLUDE_EXAMPLE_WORKERS
          --filter "Category=Integration&ServerType!=Orkes"
          -l "console;verbosity=normal"
      - name: Dump Conductor logs
        if: failure()
        run: docker compose -f scripts/docker-compose-oss.yaml logs conductor-server
