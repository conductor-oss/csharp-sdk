# Agent E2E — runs the Conductor.AI.E2eTests suites against the Conductor
# OSS server boot JAR (Maven Central) — the server this SDK ships against,
# with the agent runtime on by default from 3.32.0-rc.8 onward. The
# Agentspan server JAR is no longer used here.
#
# Secrets: OPENAI_API_KEY / ANTHROPIC_API_KEY are repo secrets. They are set at
# job level (the server consumes them for LLM calls; a few suites additionally
# key-gate on OPENAI_API_KEY in the test env — upstream parity). Fork PRs see no
# secrets and fail at the vacuous-run guard by design instead of passing green.
name: Agent E2E

on: [pull_request, workflow_dispatch]

concurrency:
  group: agent-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CONDUCTOR_SERVER_VERSION: "3.32.0-rc18"   # pinned server release — bump deliberately

jobs:
  agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONDUCTOR_SERVER_URL: http://localhost:8080/api
      CONDUCTOR_AGENT_LLM_MODEL: openai/gpt-4o-mini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Java only runs the server jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Python only for mcp-testkit and the TRX guard (no cache: pip — it
      # hard-fails without a requirements/pyproject file)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache server jar
        id: cache-server
        uses: actions/cache@v4
        with:
          path: conductor-server.jar
          key: conductor-oss-server-${{ env.CONDUCTOR_SERVER_VERSION }}

      - name: Download server jar from Maven Central
        if: steps.cache-server.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o conductor-server.jar \
            "https://repo1.maven.org/maven2/org/conductoross/conductor-server/${CONDUCTOR_SERVER_VERSION}/conductor-server-${CONDUCTOR_SERVER_VERSION}-boot.jar"

      - name: Start server
        run: |
          java -jar conductor-server.jar --server.port=8080 > server.log 2>&1 &
          for _ in $(seq 1 45); do
            if curl -sf http://localhost:8080/health | grep -q '"healthy":true\|"healthy": true'; then
              echo "server healthy"; exit 0
            fi
            sleep 2
          done
          echo "server failed to become healthy"; tail -100 server.log; exit 1

      - name: Start mcp-testkit
        run: |
          pip install mcp-testkit
          mcp-testkit --transport http --port 3001 &

      - name: Run e2e suites
        run: |
          dotnet test Conductor.AI.E2eTests/Conductor.AI.E2eTests.csproj \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=agent-e2e.trx" \
            --results-directory results

      # A dead/unhealthy server makes every [SkippableFact] skip silently — that
      # must never read as green. Fail on 0 executed or server-unreachable skips.
      # Shared verbatim with the released bundle (package-e2e-bundle.sh copies
      # this same script in), so the two lanes cannot guard differently.
      - name: Guard against vacuous run
        if: always()
        run: python3 scripts/check-results.py 'results/*.trx'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-results
          path: |
            results/
            server.log
          retention-days: 14
