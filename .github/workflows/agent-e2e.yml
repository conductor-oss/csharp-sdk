# Agent E2E — runs the Conductor.AI.E2eTests suites against the Conductor
# OSS server boot JAR (Maven Central) — the server this SDK ships against,
# with the agent runtime on by default from 3.32.0-rc.8 onward. The
# Agentspan server JAR is no longer used here.
#
# Secrets: OPENAI_API_KEY / ANTHROPIC_API_KEY are repo secrets. They are set at
# job level (the server consumes them for LLM calls; a few suites additionally
# key-gate on OPENAI_API_KEY in the test env — upstream parity). Fork PRs see no
# secrets and fail at the vacuous-run guard by design instead of passing green.
name: Agent E2E

on: [pull_request, workflow_dispatch]

concurrency:
  group: agent-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tracks the org-level E2E_TEST_OSS_CONDUCTOR_VERSION, set by conductor's
  # publish.yml on each release (shared with the pull_request.yml docker e2e).
  # Fork PRs can't read org vars, so they fall back to the pinned default.
  CONDUCTOR_SERVER_VERSION: ${{ vars.E2E_TEST_OSS_CONDUCTOR_VERSION || '3.33.0' }}

jobs:
  agent-e2e:
    # Fork PRs get no secrets, so every suite here would run against a server
    # with no LLM key and burn the full 45-minute timeout before the guard
    # below failed it. Skip outright instead.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONDUCTOR_SERVER_URL: http://localhost:8080/api
      # Default model for every suite. The Orkes-Developers OpenAI project only
      # allows the gpt-5.6 / gpt-6 families; gpt-6-luna is OpenAI's replacement
      # for gpt-4o-mini, which shuts down on 2027-01-14.
      CONDUCTOR_AGENT_LLM_MODEL: openai/gpt-6-luna
    steps:
      # A dead key, exhausted quota, retired model or provider outage makes
      # every agent test wait out its timeout — the job then hits timeout-minutes
      # before the runner reports a single failure. Call the model the suites use
      # directly, before any setup: the HTTP status and body name the cause in
      # seconds. No suite calls Anthropic through the server, so only OpenAI is
      # checked.
      - name: LLM provider check
        timeout-minutes: 1
        run: |
          fail=0
          probe() {  # label, url, curl args...
            local label=$1 url=$2; shift 2
            local code
            code=$(curl -sS -m 15 -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' "$url" "$@" \
              -H 'content-type: application/json') || true
            echo "$label: HTTP $code"
            if [ "$code" != 200 ]; then
              echo "::error::$label check failed (HTTP $code; 000 = no response in 15s)"
              cat "$RUNNER_TEMP/probe.json" 2>/dev/null || true; echo
              fail=1
            fi
          }
          # Responses API, as the server uses; 16 is its minimum max_output_tokens.
          openai_model=${CONDUCTOR_AGENT_LLM_MODEL#openai/}
          probe "OpenAI $openai_model" https://api.openai.com/v1/responses \
            -H "authorization: Bearer $OPENAI_API_KEY" \
            -d "{\"model\":\"$openai_model\",\"input\":\"ping\",\"max_output_tokens\":16,\"reasoning\":{\"effort\":\"none\"}}"
          exit $fail

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Java only runs the server jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Python only for mcp-testkit and the TRX guard (no cache: pip — it
      # hard-fails without a requirements/pyproject file)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache server jar
        id: cache-server
        uses: actions/cache@v4
        with:
          path: conductor-server.jar
          key: conductor-oss-server-${{ env.CONDUCTOR_SERVER_VERSION }}

      - name: Download server jar from Maven Central
        if: steps.cache-server.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o conductor-server.jar \
            "https://repo1.maven.org/maven2/org/conductoross/conductor-server/${CONDUCTOR_SERVER_VERSION}/conductor-server-${CONDUCTOR_SERVER_VERSION}-boot.jar"

      - name: Start server
        run: |
          java -jar conductor-server.jar --server.port=8080 > server.log 2>&1 &
          for _ in $(seq 1 45); do
            if curl -sf http://localhost:8080/health | grep -q '"healthy":true\|"healthy": true'; then
              echo "server healthy"; exit 0
            fi
            sleep 2
          done
          echo "server failed to become healthy"; tail -100 server.log; exit 1

      - name: Start mcp-testkit
        run: |
          pip install mcp-testkit
          mcp-testkit --transport http --port 3001 &

      - name: Run e2e suites
        run: |
          dotnet test Conductor.AI.E2eTests/Conductor.AI.E2eTests.csproj \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=agent-e2e.trx" \
            --results-directory results

      # The uploaded server.log is lost when the run is re-run, and a run
      # killed at timeout-minutes never reports its test failures — keep the
      # server's own errors in the job log, which survives both.
      - name: Show server errors
        if: failure() || cancelled()
        run: |
          [ -f server.log ] || exit 0
          grep -nE ' (ERROR|WARN) |Exception|[Qq]uota|rate.?limit|\b(401|403|404|429)\b' server.log \
            | grep -vE 'cannot init (Cohere|Mistral)' | tail -150

      # A dead/unhealthy server makes every [SkippableFact] skip silently — that
      # must never read as green. Fail on 0 executed or server-unreachable skips.
      # Shared verbatim with the released bundle (package-e2e-bundle.sh copies
      # this same script in), so the two lanes cannot guard differently.
      - name: Guard against vacuous run
        if: always()
        run: python3 scripts/check-results.py 'results/*.trx'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-results
          path: |
            results/
            server.log
          retention-days: 14
