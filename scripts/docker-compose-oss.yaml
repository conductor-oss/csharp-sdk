# Conductor OSS stack used to run the SDK integration tests against open-source
# Conductor. Shared by scripts/run-integration-oss.sh and the
# integration_tests_oss job in .github/workflows/pull_request.yml.
#
# The `image:` default below is the SINGLE place the Conductor OSS image tag is
# written. Everything that does not override OSS_CONDUCTOR_VERSION lands on it:
# a plain `scripts/run-integration-oss.sh` run, and the integration_tests_oss
# job on a fork PR (where GitHub withholds org variables). Overrides are the
# script's --version flag and, in CI, the org-wide
# E2E_TEST_OSS_CONDUCTOR_VERSION variable or a workflow_dispatch input. Bump the
# tag here and both follow.
#
# Per-repo name; unnamed, the project defaults to this file's dir (`scripts`) in every SDK repo and stacks collide.
name: csharp-sdk-oss-e2e
services:
  conductor-server:
    image: conductoross/conductor:${OSS_CONDUCTOR_VERSION:-3.32.3}
    environment:
      - CONFIG_PROP=config-postgres.properties
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20
    links:
      - conductor-postgres:postgresdb
    depends_on:
      conductor-postgres:
        condition: service_healthy
  conductor-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=conductor
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
